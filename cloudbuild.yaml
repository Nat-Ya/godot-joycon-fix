# Google Cloud Build configuration for Godot with Joy-Con fixes
# Builds Godot editor and Android export templates

timeout: 14400s  # 4 hours (Godot builds are slow on default machine with 1 vCPU)

options:
  diskSizeGb: 100
  logging: CLOUD_LOGGING_ONLY

serviceAccount: 'projects/general-476320/serviceAccounts/nys-godot-game-builder@general-476320.iam.gserviceaccount.com'

substitutions:
  _GODOT_VERSION: '4.3.stable'
  _IMAGE_TAG: 'latest'
  _BRANCH_NAME: '4.3-joycon-fix'
  _SHORT_SHA: 'latest'
  _ARTIFACT_REGISTRY: 'europe-west1-docker.pkg.dev/general-476320/android-build-images'

steps:
  # Step 1: Build Docker image with Godot
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - '${_ARTIFACT_REGISTRY}/godot-joycon-fix:${_IMAGE_TAG}'
      - '-t'
      - '${_ARTIFACT_REGISTRY}/godot-joycon-fix:${_SHORT_SHA}'
      - '-t'
      - '${_ARTIFACT_REGISTRY}/godot-joycon-fix:latest'
      - '--build-arg'
      - 'GODOT_BRANCH=${_BRANCH_NAME}'
      - '--build-arg'
      - 'GODOT_VERSION=${_GODOT_VERSION}'
      - '--build-arg'
      - 'SCONSFLAGS=verbose=yes warnings=extra werror=no debug_symbols=no'
      - '.'
    id: 'build-image'

  # Step 2: Push to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - '--all-tags'
      - '${_ARTIFACT_REGISTRY}/godot-joycon-fix'
    id: 'push-image'

  # Step 3: Extract APKs from built image
  - name: 'gcr.io/cloud-builders/docker'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        # Create temporary container
        CONTAINER_ID=$$(docker create ${_ARTIFACT_REGISTRY}/godot-joycon-fix:${_IMAGE_TAG})

        # Extract APKs
        docker cp $$CONTAINER_ID:/root/.local/share/godot/export_templates/${_GODOT_VERSION}/android_debug.apk ./android_debug.apk
        docker cp $$CONTAINER_ID:/root/.local/share/godot/export_templates/${_GODOT_VERSION}/android_release.apk ./android_release.apk

        # Cleanup
        docker rm $$CONTAINER_ID

        # Verify
        ls -lh android_*.apk
    id: 'extract-apks'

  # Step 4: Upload APKs as artifacts to GCS bucket
  - name: 'gcr.io/cloud-builders/gsutil'
    args:
      - 'cp'
      - 'android_debug.apk'
      - 'gs://${PROJECT_ID}_cloudbuild/godot-joycon-fix/${_SHORT_SHA}/android_debug.apk'
    id: 'upload-debug-apk'

  - name: 'gcr.io/cloud-builders/gsutil'
    args:
      - 'cp'
      - 'android_release.apk'
      - 'gs://${PROJECT_ID}_cloudbuild/godot-joycon-fix/${_SHORT_SHA}/android_release.apk'
    id: 'upload-release-apk'

# Store APKs as build artifacts (downloadable from Cloud Build UI)
artifacts:
  objects:
    location: 'gs://${PROJECT_ID}_cloudbuild/godot-joycon-fix/${_SHORT_SHA}'
    paths:
      - 'android_debug.apk'
      - 'android_release.apk'

images:
  - '${_ARTIFACT_REGISTRY}/godot-joycon-fix:${_IMAGE_TAG}'
  - '${_ARTIFACT_REGISTRY}/godot-joycon-fix:${_SHORT_SHA}'
  - '${_ARTIFACT_REGISTRY}/godot-joycon-fix:latest'
