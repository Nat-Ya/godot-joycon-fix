name: 🐳 Build Godot Docker Image

on:
  # Manual trigger
  workflow_dispatch:
    inputs:
      godot_version:
        description: 'Godot version tag (e.g., 4.3.stable)'
        required: false
        default: '4.3.stable'
      docker_tag:
        description: 'Docker image tag (default: branch name)'
        required: false
        default: ''
      platforms:
        description: 'Platforms to build (comma-separated: linux/amd64,linux/arm64)'
        required: false
        default: 'linux/amd64'

  # Auto trigger on push to main branches
  push:
    branches:
      - 4.3-joycon-fix
      - main
    paths:
      - '**/*.cpp'
      - '**/*.h'
      - 'SConstruct'
      - 'platform/android/**'
      - '.github/workflows/docker-build.yml'
      - 'Dockerfile'

# Global Settings
env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  # Used for cache key. Add version suffix to force clean build.
  GODOT_BASE_BRANCH: 4.3-joycon-fix
  SCONSFLAGS: verbose=yes warnings=extra werror=yes debug_symbols=no

concurrency:
  group: docker-build-${{github.actor}}-${{github.head_ref || github.run_number}}-${{github.ref}}
  cancel-in-progress: true

jobs:
  build-and-push:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: |
            image=moby/buildkit:latest
            network=host

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        run: |
          # Convert repository name to lowercase
          IMAGE_NAME_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "image_name=${IMAGE_NAME_LOWER}" >> $GITHUB_OUTPUT

          # Determine Godot version
          GODOT_VERSION="${{ github.event.inputs.godot_version }}"
          if [ -z "$GODOT_VERSION" ]; then
            GODOT_VERSION="4.3.stable"
          fi
          echo "godot_version=${GODOT_VERSION}" >> $GITHUB_OUTPUT

          # Determine Docker tag
          if [ -n "${{ github.event.inputs.docker_tag }}" ]; then
            TAG="${{ github.event.inputs.docker_tag }}"
          elif [ "${{ github.ref }}" == "refs/heads/main" ]; then
            TAG="latest"
          elif [ "${{ github.ref }}" == "refs/heads/4.3-joycon-fix" ]; then
            TAG="4.3-joycon-fix"
          else
            TAG=$(echo "${{ github.ref_name }}" | sed 's/[^a-zA-Z0-9._-]/-/g')
          fi

          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "date=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> $GITHUB_OUTPUT
          echo "sha_short=$(echo ${{ github.sha }} | cut -c1-7)" >> $GITHUB_OUTPUT

          # Determine platforms
          PLATFORMS="${{ github.event.inputs.platforms }}"
          if [ -z "$PLATFORMS" ]; then
            PLATFORMS="linux/amd64"
          fi
          echo "platforms=${PLATFORMS}" >> $GITHUB_OUTPUT

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          build-args: |
            GODOT_BRANCH=${{ github.ref_name }}
            GODOT_VERSION=${{ steps.meta.outputs.godot_version }}
            SCONSFLAGS=${{ env.SCONSFLAGS }}
          tags: |
            ${{ env.REGISTRY }}/${{ steps.meta.outputs.image_name }}:${{ steps.meta.outputs.tag }}
            ${{ env.REGISTRY }}/${{ steps.meta.outputs.image_name }}:sha-${{ steps.meta.outputs.sha_short }}
          labels: |
            org.opencontainers.image.title=Godot Engine with Joy-Con Fix
            org.opencontainers.image.description=Godot 4.3 with Android Joy-Con D-pad fix for building game apps
            org.opencontainers.image.url=https://github.com/${{ github.repository }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.meta.outputs.tag }}
            org.opencontainers.image.created=${{ steps.meta.outputs.date }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.vendor=Godot Engine
          platforms: ${{ steps.meta.outputs.platforms }}
          cache-from: |
            type=gha
            type=registry,ref=${{ env.REGISTRY }}/${{ steps.meta.outputs.image_name }}:${{ steps.meta.outputs.tag }}
          cache-to: |
            type=gha,mode=max
            type=registry,ref=${{ env.REGISTRY }}/${{ steps.meta.outputs.image_name }}:${{ steps.meta.outputs.tag }},mode=max

      - name: Test image (amd64)
        if: contains(steps.meta.outputs.platforms, 'linux/amd64')
        run: |
          echo "Testing Godot editor..."
          docker run --rm --platform linux/amd64 \
            ${{ env.REGISTRY }}/${{ steps.meta.outputs.image_name }}:${{ steps.meta.outputs.tag }} \
            /opt/godot/bin/godot.linuxbsd.editor.x86_64 --version
          
          echo "Testing export templates..."
          docker run --rm --platform linux/amd64 \
            ${{ env.REGISTRY }}/${{ steps.meta.outputs.image_name }}:${{ steps.meta.outputs.tag }} \
            sh -c "ls -lh /root/.local/share/godot/export_templates/${{ steps.meta.outputs.godot_version }}/ && \
                   test -f /root/.local/share/godot/export_templates/${{ steps.meta.outputs.godot_version }}/android_release.apk && \
                   test -f /root/.local/share/godot/export_templates/${{ steps.meta.outputs.godot_version }}/android_debug.apk && \
                   echo '✅ Export templates verified'"

      - name: Test image (arm64)
        if: contains(steps.meta.outputs.platforms, 'linux/arm64')
        run: |
          echo "Testing Godot editor (arm64)..."
          docker run --rm --platform linux/arm64 \
            ${{ env.REGISTRY }}/${{ steps.meta.outputs.image_name }}:${{ steps.meta.outputs.tag }} \
            /opt/godot/bin/godot.linuxbsd.editor.x86_64 --version || echo "Note: arm64 build may have different binary path"
          
          echo "Testing export templates (arm64)..."
          docker run --rm --platform linux/arm64 \
            ${{ env.REGISTRY }}/${{ steps.meta.outputs.image_name }}:${{ steps.meta.outputs.tag }} \
            sh -c "ls -lh /root/.local/share/godot/export_templates/${{ steps.meta.outputs.godot_version }}/ && \
                   echo '✅ Export templates verified'"

      - name: Build summary
        run: |
          echo "## 🐳 Docker Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Godot Version:** \`${{ steps.meta.outputs.godot_version }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Docker Image:** \`${{ env.REGISTRY }}/${{ steps.meta.outputs.image_name }}:${{ steps.meta.outputs.tag }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Platforms:** \`${{ steps.meta.outputs.platforms }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** \`${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** \`${{ steps.meta.outputs.sha_short }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Date:** ${{ steps.meta.outputs.date }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📥 Pull Image" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
          echo "docker pull ${{ env.REGISTRY }}/${{ steps.meta.outputs.image_name }}:${{ steps.meta.outputs.tag }}" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🎮 Use in Dockerfile for Game App Building" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`dockerfile" >> $GITHUB_STEP_SUMMARY
          echo "FROM ${{ env.REGISTRY }}/${{ steps.meta.outputs.image_name }}:${{ steps.meta.outputs.tag }} AS godot-base" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "# Copy Godot editor binary" >> $GITHUB_STEP_SUMMARY
          echo "COPY --from=godot-base /opt/godot/bin/godot.linuxbsd.editor.x86_64 /usr/local/bin/godot" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "# Copy export templates (for Android builds)" >> $GITHUB_STEP_SUMMARY
          echo "COPY --from=godot-base /root/.local/share/godot /root/.local/share/godot" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "# Copy Android SDK (for export)" >> $GITHUB_STEP_SUMMARY
          echo "COPY --from=godot-base /opt/android-sdk /opt/android-sdk" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "ENV ANDROID_HOME=/opt/android-sdk" >> $GITHUB_STEP_SUMMARY
          echo "ENV ANDROID_SDK_ROOT=/opt/android-sdk" >> $GITHUB_STEP_SUMMARY
          echo "ENV PATH=\${ANDROID_HOME}/cmdline-tools/latest/bin:\${ANDROID_HOME}/platform-tools:\${PATH}" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🚀 Quick Start" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
          echo "# Run Godot editor" >> $GITHUB_STEP_SUMMARY
          echo "docker run --rm -v \$(pwd):/workspace \\" >> $GITHUB_STEP_SUMMARY
          echo "  ${{ env.REGISTRY }}/${{ steps.meta.outputs.image_name }}:${{ steps.meta.outputs.tag }} \\" >> $GITHUB_STEP_SUMMARY
          echo "  /opt/godot/bin/godot.linuxbsd.editor.x86_64 --path /workspace" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
