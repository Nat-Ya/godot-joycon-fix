name: 🚀 Build with Google Cloud Build

on:
  push:
    branches:
      - 4.3-joycon-fix
      - main
    paths:
      - '**/*.cpp'
      - '**/*.h'
      - '**/*.java'
      - 'SConstruct'
      - 'platform/android/**'
      - 'Dockerfile'
      - 'cloudbuild.yaml'
      - '.github/workflows/gcp-cloudbuild.yml'

  workflow_dispatch:
    inputs:
      godot_version:
        description: 'Godot version (e.g., 4.3.stable)'
        required: false
        default: '4.3.stable'
        type: string

      machine_type:
        description: 'Cloud Build machine type (europe-west1)'
        required: false
        default: 'default'
        type: choice
        options:
          - 'default'           # 1 vCPU, 4 GB RAM - FREE TIER (120 min/day)
          - 'E2_HIGHCPU_8'      # 8 vCPUs, 8 GB RAM - ~$0.016/min
          - 'E2_HIGHCPU_32'     # 32 vCPUs, 32 GB RAM - ~$0.064/min
          - 'N1_HIGHCPU_8'      # 8 vCPUs, 7.2 GB RAM - ~$0.016/min
          - 'N1_HIGHCPU_32'     # 32 vCPUs, 28.8 GB RAM - ~$0.064/min

      timeout_seconds:
        description: 'Build timeout in seconds (default: 28800 = 8 hours)'
        required: false
        default: '28800'
        type: string

      clear_cache:
        description: 'Clear Kaniko layer cache before build'
        required: false
        default: false
        type: boolean

env:
  # Use secrets if available, otherwise fall back to defaults
  GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID || 'general-476320' }}
  GCP_REGION: ${{ secrets.GCP_REGION || 'europe-west1' }}
  GCP_ARTIFACT_REGISTRY: ${{ secrets.GCP_ARTIFACT_REGISTRY || 'europe-west1-docker.pkg.dev/general-476320/android-build-images' }}

jobs:
  cloud-build:
    name: Build on GCP Cloud Build
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate GCP configuration
        run: |
          if [ -z "${{ secrets.GCP_SA_KEY }}" ]; then
            echo "❌ ERROR: GCP_SA_KEY secret is not configured!"
            echo "Please add the service account key to GitHub secrets."
            echo "See GH_WORKFLOW.WITH_CLOUDBUILD.NEXT_STEPS.md for setup instructions."
            exit 1
          fi
          echo "✅ GCP Project: ${{ env.GCP_PROJECT_ID }}"
          echo "✅ GCP Region: ${{ env.GCP_REGION }}"
          echo "✅ Artifact Registry: ${{ env.GCP_ARTIFACT_REGISTRY }}"

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}

      - name: Configure Docker for Artifact Registry
        run: |
          gcloud auth configure-docker ${{ env.GCP_REGION }}-docker.pkg.dev

      - name: Clear Kaniko cache (if requested)
        if: ${{ github.event.inputs.clear_cache == 'true' }}
        run: |
          echo "🗑️  Clearing Kaniko layer cache..."
          # Delete all cache tags from the cache repository
          CACHE_REPO="${{ env.GCP_ARTIFACT_REGISTRY }}/godot-joycon-fix/cache"
          
          # List and delete cache images
          gcloud artifacts docker images list $CACHE_REPO --format="value(package)" 2>/dev/null | while read -r image; do
            echo "Deleting cache image: $image"
            gcloud artifacts docker images delete "$image" --quiet --delete-tags 2>/dev/null || true
          done
          
          echo "✅ Cache cleared"

      - name: Prepare build configuration
        id: config
        run: |
          # Determine machine type
          MACHINE_TYPE="${{ github.event.inputs.machine_type }}"
          if [ -z "$MACHINE_TYPE" ] || [ "$MACHINE_TYPE" = "default" ]; then
            MACHINE_TYPE=""
            echo "🖥️  Machine type: default (1 vCPU, 4 GB RAM) - FREE TIER"
          else
            echo "🖥️  Machine type: $MACHINE_TYPE"
          fi
          echo "machine_type=$MACHINE_TYPE" >> $GITHUB_OUTPUT

          # Determine timeout (default 8 hours = 28800 seconds)
          TIMEOUT_SECONDS="${{ github.event.inputs.timeout_seconds }}"
          if [ -z "$TIMEOUT_SECONDS" ]; then
            TIMEOUT_SECONDS="28800"
          fi
          echo "⏱️  Timeout: ${TIMEOUT_SECONDS}s ($(echo "scale=1; $TIMEOUT_SECONDS / 3600" | bc)h)"
          echo "timeout=${TIMEOUT_SECONDS}s" >> $GITHUB_OUTPUT

          # If non-default machine type, inject it into cloudbuild.yaml
          if [ -n "$MACHINE_TYPE" ]; then
            echo "📝 Injecting machineType: $MACHINE_TYPE into build config..."
            # Use yq to inject machineType into options
            # First install yq if not available
            if ! command -v yq &> /dev/null; then
              sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
              sudo chmod +x /usr/local/bin/yq
            fi
            yq eval ".options.machineType = \"$MACHINE_TYPE\"" -i cloudbuild.yaml
            echo "✅ Updated cloudbuild.yaml with machineType: $MACHINE_TYPE"
            cat cloudbuild.yaml | head -30
          fi

      - name: Submit build to Cloud Build
        id: build
        run: |
          # Determine Godot version
          GODOT_VERSION="${{ github.event.inputs.godot_version }}"
          if [ -z "$GODOT_VERSION" ]; then
            GODOT_VERSION="4.3.stable"
          fi

          # Get branch name and short SHA
          BRANCH_NAME="${{ github.ref_name }}"
          SHORT_SHA=$(git rev-parse --short HEAD)

          # Get timeout from previous step
          TIMEOUT="${{ steps.config.outputs.timeout }}"

          # Build substitutions string
          SUBSTITUTIONS="_GODOT_VERSION=$GODOT_VERSION,_IMAGE_TAG=$BRANCH_NAME,_BRANCH_NAME=$BRANCH_NAME,_SHORT_SHA=$SHORT_SHA,_TIMEOUT=$TIMEOUT"

          echo "📋 Build Configuration:"
          echo "   Godot Version: $GODOT_VERSION"
          echo "   Branch: $BRANCH_NAME"
          echo "   Commit: $SHORT_SHA"
          echo "   Timeout: $TIMEOUT"
          echo "   Machine Type: ${{ steps.config.outputs.machine_type || 'default (free tier)' }}"

          # Submit build with all required substitutions
          BUILD_ID=$(gcloud builds submit \
            --config=cloudbuild.yaml \
            --substitutions="$SUBSTITUTIONS" \
            --region=${{ env.GCP_REGION }} \
            --format="value(id)")

          echo "build_id=$BUILD_ID" >> $GITHUB_OUTPUT
          echo "✅ Cloud Build submitted: $BUILD_ID"

      - name: Wait for build completion
        id: status
        run: |
          echo "⏳ Waiting for Cloud Build to complete..."
          echo "Build ID: ${{ steps.build.outputs.build_id }}"

          # Poll every 30 seconds instead of streaming (less API calls)
          while true; do
            STATUS=$(gcloud builds describe ${{ steps.build.outputs.build_id }} \
              --region=${{ env.GCP_REGION }} \
              --format="value(status)")

            echo "Current status: $STATUS"

            if [ "$STATUS" = "SUCCESS" ]; then
              echo "✅ Build succeeded!"
              echo "status=$STATUS" >> $GITHUB_OUTPUT
              break
            elif [ "$STATUS" = "FAILURE" ] || [ "$STATUS" = "TIMEOUT" ] || [ "$STATUS" = "CANCELLED" ]; then
              echo "❌ Build failed with status: $STATUS"
              echo "status=$STATUS" >> $GITHUB_OUTPUT

              # Fetch logs on failure
              echo "Fetching build logs..."
              gcloud builds log --region=${{ env.GCP_REGION }} ${{ steps.build.outputs.build_id }}
              exit 1
            fi

            # Wait 30 seconds before next poll
            sleep 30
          done

      - name: Build summary
        if: always()
        run: |
          echo "## 🚀 GCP Cloud Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Build Configuration" >> $GITHUB_STEP_SUMMARY
          echo "| Setting | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|---------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| **Build ID** | \`${{ steps.build.outputs.build_id }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Status** | \`${{ steps.status.outputs.status }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Branch** | \`${{ github.ref_name }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Commit** | \`$(git rev-parse --short HEAD)\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Machine Type** | \`${{ steps.config.outputs.machine_type || 'default (1 vCPU, free tier)' }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Timeout** | \`${{ steps.config.outputs.timeout }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Cache Cleared** | \`${{ github.event.inputs.clear_cache || 'false' }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          echo "### 🗄️ Caching Strategy" >> $GITHUB_STEP_SUMMARY
          echo "This build uses **Kaniko layer caching** in Artifact Registry:" >> $GITHUB_STEP_SUMMARY
          echo "- Base OS & dependencies: cached (rarely changes)" >> $GITHUB_STEP_SUMMARY
          echo "- Android SDK: cached (rarely changes)" >> $GITHUB_STEP_SUMMARY
          echo "- Third-party libraries: cached (occasionally changes)" >> $GITHUB_STEP_SUMMARY
          echo "- Source code: rebuilt on changes" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Cache location: \`${{ env.GCP_ARTIFACT_REGISTRY }}/godot-joycon-fix/cache\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          echo "### 📥 Pull Docker Image" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
          echo "docker pull ${{ env.GCP_ARTIFACT_REGISTRY }}/godot-joycon-fix:${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          echo "### 📦 Download Artifacts" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
          echo "SHORT_SHA=$(git rev-parse --short HEAD)" >> $GITHUB_STEP_SUMMARY
          echo "# Download APKs" >> $GITHUB_STEP_SUMMARY
          echo "gsutil cp gs://${{ env.GCP_PROJECT_ID }}_cloudbuild/godot-joycon-fix/\${SHORT_SHA}/android_debug.apk ./" >> $GITHUB_STEP_SUMMARY
          echo "gsutil cp gs://${{ env.GCP_PROJECT_ID }}_cloudbuild/godot-joycon-fix/\${SHORT_SHA}/android_release.apk ./" >> $GITHUB_STEP_SUMMARY
          echo "# Download Linux Editor" >> $GITHUB_STEP_SUMMARY
          echo "gsutil cp gs://${{ env.GCP_PROJECT_ID }}_cloudbuild/godot-joycon-fix/\${SHORT_SHA}/godot.linuxbsd.editor.x86_64 ./" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          echo "### 🔗 Links" >> $GITHUB_STEP_SUMMARY
          echo "- [Cloud Build Console](https://console.cloud.google.com/cloud-build/builds;region=${{ env.GCP_REGION }}/${{ steps.build.outputs.build_id }}?project=${{ env.GCP_PROJECT_ID }})" >> $GITHUB_STEP_SUMMARY
          echo "- [Artifact Registry](https://console.cloud.google.com/artifacts/docker/${{ env.GCP_PROJECT_ID }}/${{ env.GCP_REGION }}/android-build-images/godot-joycon-fix?project=${{ env.GCP_PROJECT_ID }})" >> $GITHUB_STEP_SUMMARY
          echo "- [GCS Artifacts](https://console.cloud.google.com/storage/browser/${{ env.GCP_PROJECT_ID }}_cloudbuild/godot-joycon-fix/)" >> $GITHUB_STEP_SUMMARY
